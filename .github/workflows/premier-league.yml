name: Premier League — Big Six — Canal+

on:
  workflow_dispatch:
  schedule:
    # UTC : mise à jour toutes les six heures.
    - cron: '37 */6 * * *'
  push:
    paths:
      - 'premier_league.py'
      - 'tests_pl/test*.py'
      - 'tests_pl/fixtures/**'
      - '.github/workflows/premier-league.yml'

permissions:
  contents: write

concurrency:
  group: premier-league-calendar
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests et syntaxe
        run: |
          python -m compileall -q premier_league.py tests_pl
          python -m unittest discover -s tests_pl -p 'test*.py' -v
      - name: Mettre à jour le calendrier Premier League séparé
        run: python premier_league.py
      - name: Enregistrer uniquement le calendrier Premier League
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add -- premier_league_canal_calendar.ics
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Mise à jour du calendrier Premier League'
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            # Checkout jetable du runner : reprendre l'historique publié et
            # le dernier code, puis recalculer, sans fusion textuelle de l'ICS.
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            python -m compileall -q premier_league.py tests_pl
            python -m unittest discover -s tests_pl -p 'test*.py' -v
            python premier_league.py
          done
          exit 1
