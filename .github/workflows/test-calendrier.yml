name: test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install requests

      - name: Générer le calendrier F1
        run: python f1.py

      - name: Publier le calendrier mis à jour
        shell: bash
        run: |
          if git diff --quiet -- f1_calendar.ics; then
            echo "Le calendrier est déjà à jour."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1_calendar.ics
          git commit -m "Mise à jour automatique du calendrier F1"
          git push
