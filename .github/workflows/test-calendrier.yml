name: Test du calendrier

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # toutes les 6h — ajustez selon la fréquence de mise à jour souhaitée

permissions:
  contents: write  # nécessaire pour que l'Action puisse pousser le fichier .ics généré

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer nos fichiers
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les bibliothèques
        run: pip install requests

      - name: Lancer notre programme
        run: python f1.py

      - name: Publier le calendrier si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1_calendar.ics
          if git diff --cached --quiet; then
            echo "Aucun changement détecté dans f1_calendar.ics"
          else
            git commit -m "Mise à jour automatique du calendrier F1"
            git push
          fi
