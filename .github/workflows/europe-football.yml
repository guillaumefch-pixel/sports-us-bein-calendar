name: Football Europe — Liga, Bayern et Ligue des champions

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  push:
    paths:
      - 'europe_football.py'
      - 'playoff_context.py'
      - 'tests_playoffs/**'
      - 'premier_league.py'
      - 'team_context.py'
      - 'calendar_locations.py'
      - 'venues.json'
      - 'tests_europe/**'
      - '.github/workflows/europe-football.yml'

permissions:
  contents: write

concurrency:
  group: football-europe-calendar
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier les scripts et les nouveaux tests
        run: |
          python -m compileall -q europe_football.py premier_league.py team_context.py calendar_locations.py playoff_context.py tests_europe tests_playoffs
          python -m unittest discover -s tests_europe -v
          python -m unittest discover -s tests_playoffs -v
      - name: Générer Football Europe
        run: python europe_football.py
      - name: Publier le nouvel agenda
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- europe_football_calendar.ics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Mise à jour du calendrier Football Europe'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || exit 1
          done
          exit 1
